# App-wide look: colors, fonts and toolbar. Streamlit reads this automatically.
# There are two palettes. Visitors start on their device's setting and can flip
# between them with the "Dark mode" switch in the sidebar.

[theme]
showWidgetBorder = true
baseRadius = "4px"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
headingFontWeights = 700

# Night: graphite with warm off-white text and a steel blue accent.
[theme.dark]
primaryColor = "#8FB3D9"
backgroundColor = "#17191C"
secondaryBackgroundColor = "#1E2125"
textColor = "#E9E5DB"
borderColor = "#353940"

[theme.dark.sidebar]
backgroundColor = "#1B1D20"

# Day: warm paper with ink-blue accents, like a printed report card.
[theme.light]
primaryColor = "#1F4E79"
backgroundColor = "#F3F0E8"
secondaryBackgroundColor = "#E9E4D9"
textColor = "#1C1E21"
borderColor = "#D3CCBE"

[theme.light.sidebar]
backgroundColor = "#ECE8DE"

[client]
toolbarMode = "minimal"
