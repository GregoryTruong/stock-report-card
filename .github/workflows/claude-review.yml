# Claude reads every pull request and leaves review comments: likely bugs,
# risky changes and missing tests. It needs an Anthropic API key saved as the
# repository secret ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions).
# Without the key the job skips itself instead of failing.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only review PRs from this repository, never from forks, so the key can't leak.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip when no API key is set
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Add the ANTHROPIC_API_KEY repository secret to turn on Claude reviews."

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Focus on:
            - Bugs and wrong financial math (returns, volatility, drawdown, beta, grading cutoffs)
            - Things that would break the Streamlit app or the live demo
            - Missing or weak tests for the changed code
            Skip style nits that ruff already catches. Be brief and specific.

            Put comments on specific lines with mcp__github_inline_comment__create_inline_comment,
            then post one short summary with `gh pr comment`. If everything looks fine, say so in one line.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
